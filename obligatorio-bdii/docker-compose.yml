services:
  mysql:
    image: mysql:8.0
    container_name: ticketing_db
    command: --default-authentication-plugin=mysql_native_password --log_bin_trust_function_creators=1
    environment:
      MYSQL_DATABASE: ticketing_mundial
      MYSQL_USER: ticketing_user
      MYSQL_PASSWORD: ticketing_pass
      MYSQL_ROOT_PASSWORD: root_pass
      TZ: America/Argentina/Buenos_Aires
    ports:
      - "3307:3306"
    volumes:
      - ./sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./sql/02_inserts.sql:/docker-entrypoint-initdb.d/02_inserts.sql:ro
      - ./sql/04_stored_procedures.sql:/docker-entrypoint-initdb.d/04_stored_procedures.sql:ro
      - ./sql/05_triggers.sql:/docker-entrypoint-initdb.d/05_triggers.sql:ro
      - ./sql/07_views.sql:/docker-entrypoint-initdb.d/07_views.sql:ro
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uticketing_user", "-pticketing_pass"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: ticketing_api
    ports:
      - "8000:8000"

    env_file:
      - .env.local

    environment:
      DATABASE_URL: mysql://ticketing_user:ticketing_pass@mysql:3306/ticketing_mundial
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173

    depends_on:
      mysql:
        condition: service_healthy
        
  frontend:
    build: ./frontend
    container_name: ticketing_frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend
